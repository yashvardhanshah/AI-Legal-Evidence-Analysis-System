name: legal-evidence
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal_app}
      POSTGRES_DB: ${POSTGRES_DB:-legal_evidence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    image: legal-evidence-backend
    pull_policy: never
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-legal_evidence}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-legal_evidence}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      PRIVATE_ROOT: /private_data
      OCR_ENABLED: "true"
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-20000000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ACCESS_MINUTES: ${ACCESS_MINUTES:-15}
      REFRESH_DAYS: ${REFRESH_DAYS:-7}
    volumes:
      - ./.local/phase2:/private_data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    image: legal-evidence-backend
    pull_policy: never
    command: ["python", "-m", "app.analysis_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-legal_evidence}
      PRIVATE_ROOT: /private_data
      ANALYSIS_JOB_TIMEOUT: ${ANALYSIS_JOB_TIMEOUT:-600}
      ANALYSIS_MAX_PAGES: ${ANALYSIS_MAX_PAGES:-50}
    volumes:
      - ./.local/phase2/evidence-originals:/private_data/evidence-originals:ro
      - ./.local/phase2/models/ner:/private_data/models/ner:ro
      - ./.local/phase2/derived:/private_data/derived
    mem_limit: 1800m
    cpus: 2.0
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.analysis_worker", "--health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  visual-worker:
    image: legal-evidence-backend
    pull_policy: never
    command: ["python", "-m", "app.analysis_worker", "--kind", "visual_analysis"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-legal_evidence}
      PRIVATE_ROOT: /private_data
      ANALYSIS_JOB_TIMEOUT: ${ANALYSIS_JOB_TIMEOUT:-600}
      VISUAL_MAX_SECONDS: ${VISUAL_MAX_SECONDS:-120}
      VISUAL_MAX_FRAMES: ${VISUAL_MAX_FRAMES:-60}
      VISUAL_INTERVAL_MS: ${VISUAL_INTERVAL_MS:-2000}
      VISUAL_CONFIDENCE: ${VISUAL_CONFIDENCE:-0.35}
    volumes:
      - ./.local/phase2/evidence-originals:/private_data/evidence-originals:ro
      - ./.local/phase2/models/vision:/private_data/models/vision:ro
      - ./.local/phase2/derived:/private_data/derived
    mem_limit: 1200m
    cpus: 2.0
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.analysis_worker", "--kind", "visual_analysis", "--health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  research-worker:
    image: legal-evidence-backend
    pull_policy: never
    command: ["python", "-m", "app.analysis_worker", "--kind", "legal_research"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-legal_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-legal_evidence}
      PRIVATE_ROOT: /private_data
      ANALYSIS_JOB_TIMEOUT: ${ANALYSIS_JOB_TIMEOUT:-600}
    volumes:
      - ./.local/phase2/evidence-originals:/private_data/evidence-originals:ro
      - ./.local/phase2/originals:/private_data/originals:ro
      - ./.local/phase2/derived:/private_data/derived:ro
      - ./.local/phase2/models/1110a243fdf4706b3f48f1d95db1a4f5529b4d41:/private_data/models/1110a243fdf4706b3f48f1d95db1a4f5529b4d41:ro
      - ./.local/phase2/chroma:/private_data/chroma
      - ./.local/phase2/chroma-statutes:/private_data/chroma-statutes
    mem_limit: 1400m
    cpus: 2.0
    pids_limit: 128
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.analysis_worker", "--kind", "legal_research", "--health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/system').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
volumes:
  postgres_data:
